[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trader"
version = "0.1.0"
description = "Experimental cryptocurrency market-microstructure research system"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5,<3",
    "websockets>=17.1,<18",
]

[project.optional-dependencies]
cloud = [
    "google-cloud-storage==3.15.0",
]
dev = [
    "pytest>=9,<10",
    "ruff>=0.16,<0.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
